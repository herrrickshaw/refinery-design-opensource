[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refinery-design-opensource"
version = "0.1.0"
description = "Open-source conceptual sizing tools for an oil refinery (crude assays and crude types, crude/vacuum distillation, FCC reactor-regenerator, hydrotreating, delayed coking, Nelson complexity)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "CoolProp>=6.6",
    "scipy>=1.11",
    "numpy>=1.24",
    "streamlit>=1.32",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["refinery_design*"]

[tool.setuptools.package-data]
refinery_design = ["data/*.json"]
